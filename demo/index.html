<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Free online QR code and barcode scanner">
	<meta name="keywords" content="qr, barcode, scanner, free, online">
	<meta name="author" content="Gracjan Mika">
	<title>QR & Barcode Scanner</title>
	
	<link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
	<h3 id="page-title">QR & Barcode Scanner<br/><span>by <a class="link-effect" href="https://gmika.pl">Gracjan Mika</a></span></h3>
	<div id="container-barcode-not-working" class="text-center d-none">
		<h3>This browser does not support barcode/QR code recognition</h3>
	</div>
	
	<div id="container-user-not-allowed" class="text-center d-none">
		<h3>Access to the camera has not been allowed</h3>
	</div>
	
	<div id="container-not-working" class="text-center d-none">
		<h3>The photo-taking function is not supported by your browser</h3>
	</div>
	
	<div id="container-loading">
		<div class="loading"></div>
	</div>
	
	<div id="container-camera" class="d-none">
		<video id="video-player" muted autoplay></video>
		<button id="btnFlash">&#9889;</button>
		<select id="videoSource"></select>
	</div>
	
	<div id="screen-preview" class="d-none">
		<div id="screenshot-container">
			<canvas id="screenshot"></canvas>
			<p id="detectedText"></p>
			<div id="decision-container">
				<button id="cancelImage" onclick="cancelAccept();">&#10008;</button>
			</div>
		</div>
	</div>
	
	<div id="github-container">
		<a href="https://github.com/MrGracu/qbscan_js"><img src="GitHub_Logo.png" alt="GitHub Logo" title="Find on GitHub" width="60"/></a>
	</div>

	<script src="https://cdn.jsdelivr.net/gh/MrGracu/qbscan_js@main/production/qbscan.js"></script>
	<script src="main.js"></script>
</body>
</html>
